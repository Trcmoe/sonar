name: Sync upstream

on:
  schedule:
    # Four times a day, away from the busy start of the hour.
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: upstream-sync-${{ github.repository }}
  cancel-in-progress: false

jobs:
  sync:
    name: Merge, build, and publish
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out fork main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Merge upstream main
        id: merge
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/jonesdevelopment/sonar.git
          git fetch --no-tags upstream main

          upstream_sha="$(git rev-parse upstream/main)"
          echo "upstream_sha=$upstream_sha" >> "$GITHUB_OUTPUT"

          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "result=unchanged" >> "$GITHUB_OUTPUT"
            echo "Fork main already contains upstream/main at $upstream_sha."
            exit 0
          fi

          if git merge --no-ff upstream/main -m "Merge upstream main into fork"; then
            echo "result=updated" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git merge --abort || true
          echo "result=conflict" >> "$GITHUB_OUTPUT"
          echo "Upstream main conflicts with the fork patches."

      - name: Set up JDK 21
        if: steps.merge.outputs.result == 'updated'
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin

      - name: Set up Gradle
        if: steps.merge.outputs.result == 'updated'
        uses: gradle/actions/setup-gradle@v4

      - name: Build all Sonar modules
        if: steps.merge.outputs.result == 'updated'
        id: build
        continue-on-error: true
        run: ./gradlew build-sonar

      - name: Upload Velocity artifact
        if: steps.merge.outputs.result == 'updated' && steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: Sonar-Velocity-${{ steps.merge.outputs.upstream_sha }}
          path: velocity/build/libs/Sonar-Velocity.jar
          if-no-files-found: error
          retention-days: 14

      - name: Push verified merge
        if: steps.merge.outputs.result == 'updated' && steps.build.outcome == 'success'
        run: git push origin HEAD:main

      - name: Close resolved sync issue
        if: steps.merge.outputs.result == 'updated' && steps.build.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          title="Automated upstream sync failed"
          issue_number="$(gh issue list --state open --search "$title in:title" --json number,title --jq ".[] | select(.title == \"$title\") | .number" | head -n 1)"

          if [[ -n "$issue_number" ]]; then
            gh issue comment "$issue_number" --body "Resolved by successful run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            gh issue close "$issue_number" --reason completed
          fi

      - name: Report sync failure
        if: always() && (failure() || steps.merge.outputs.result == 'conflict' || steps.build.outcome == 'failure')
        env:
          GH_TOKEN: ${{ github.token }}
          MERGE_RESULT: ${{ steps.merge.outputs.result }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          UPSTREAM_SHA: ${{ steps.merge.outputs.upstream_sha }}
        shell: bash
        run: |
          set -euo pipefail
          title="Automated upstream sync failed"
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          body="The scheduled upstream sync needs attention.

          - Upstream commit: \`${UPSTREAM_SHA:-unknown}\`
          - Merge result: \`${MERGE_RESULT:-unknown}\`
          - Build outcome: \`${BUILD_OUTCOME:-not-run}\`
          - Workflow run: $run_url

          The fork's \`main\` branch was not modified."

          issue_number="$(gh issue list --state open --search "$title in:title" --json number,title --jq ".[] | select(.title == \"$title\") | .number" | head -n 1)"

          if [[ -n "$issue_number" ]]; then
            gh issue comment "$issue_number" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi

      - name: Fail on merge conflict or build failure
        if: always() && (steps.merge.outputs.result == 'conflict' || steps.build.outcome == 'failure')
        run: exit 1
